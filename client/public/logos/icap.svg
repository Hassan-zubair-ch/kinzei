<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%" height="100%">
  <!-- ICAP Crest & Shield -->
  <g transform="translate(62, 60) scale(0.95)">
    <!-- Laurel Wreath -->
    <path d="M -34 25 C -54 0, -44 -34, 0 -44" stroke="#047857" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 34 25 C 54 0, 44 -34, 0 -44" stroke="#047857" stroke-width="3.5" fill="none" stroke-linecap="round" />
    
    <!-- Crescent & Star -->
    <path d="M -5 -38 A 7 7 0 1 0 5 -28 A 8 8 0 1 1 -5 -38 Z" fill="#047857" />
    <polygon points="4,-34 5.5,-30 10,-30 6.5,-27.5 8,-23 4,-26 0,-23 1.5,-27.5 -2,-30 2.5,-30" fill="#047857" />
    
    <!-- Shield -->
    <path d="M -24 -20 L 24 -20 L 24 8 C 24 24 0 34 0 34 C 0 34 -24 24 -24 8 Z" fill="#0284C7" stroke="#047857" stroke-width="2" />
    
    <!-- Scales inside Shield -->
    <line x1="-15" y1="-7" x2="15" y2="-7" stroke="#FEF08A" stroke-width="2.5" />
    <line x1="0" y1="-16" x2="0" y2="4" stroke="#FEF08A" stroke-width="2.5" />
    <polygon points="-18,4 -12,4 -15,-7" fill="#FEF08A" />
    <polygon points="12,4 18,4 15,-7" fill="#FEF08A" />
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(130, 36)">
    <text x="0" y="26" font-family="'Times New Roman', Georgia, serif" font-size="34" font-weight="900" fill="#047857" letter-spacing="2">ICAP</text>
    <text x="0" y="44" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="800" fill="#1F2937">THE INSTITUTE OF CHARTERED</text>
    <text x="0" y="58" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="800" fill="#1F2937">ACCOUNTANTS OF PAKISTAN</text>
  </g>
</svg>
